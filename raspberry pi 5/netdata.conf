# RAM: one day of history, no ML, fewer collectors. Restart after edits.
# If RAM stays high, delete the netdatacache volume once (old metric index).

[db]
    storage tiers = 1
    dbengine tier 0 retention time = 1d
    dbengine tier 0 retention size = 256MiB
    cleanup obsolete charts after = 10m

[ml]
    enabled = no

[plugins]
    apps = no
    go.d = no
    python.d = no
    charts.d = no
    ebpf = no
